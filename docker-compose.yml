services:
  mysql:
    image: mysql:8.4
    container_name: shonga-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: shonga
      MYSQL_USER: shonga
      MYSQL_PASSWORD: shonga_password
      MYSQL_ROOT_PASSWORD: shonga_root_password
    ports:
      - "3306:3306"
    volumes:
      - shonga_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pshonga_root_password"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  shonga_mysql_data:
